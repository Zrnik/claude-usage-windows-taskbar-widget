name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: ClaudeUsageWidget/ClaudeUsageWidget.csproj

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.2.24" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish ClaudeUsageWidget
          -c Release
          -r ${{ matrix.rid }}
          --no-self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:AssemblyVersion=${{ steps.version.outputs.value }}.0
          -p:FileVersion=${{ steps.version.outputs.value }}.0
          -o publish/${{ matrix.rid }}

      - name: Rename artifact
        run: mv publish/${{ matrix.rid }}/ClaudeUsageWidget.exe publish/${{ matrix.rid }}/ClaudeUsageWidget-${{ matrix.rid }}.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        with:
          files: publish/${{ matrix.rid }}/ClaudeUsageWidget-${{ matrix.rid }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  linux-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/ClaudeUsageWidget.LinuxDaemon/ClaudeUsageWidget.LinuxDaemon.csproj

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.2.24" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DEB
        run: VERSION=${{ steps.version.outputs.value }} ./scripts/build-deb.sh

      - name: Build RPM
        run: VERSION=${{ steps.version.outputs.value }} ./scripts/build-rpm.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          token: ${{ secrets.GITHUB_TOKEN }}
